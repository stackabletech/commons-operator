---
# Switching a StatefulSet from resource-version to data-hash keeps the Pod template annotations of
# objects that were not written since, so the switch itself does not restart the Pods.

apiVersion: v1
kind: ConfigMap
metadata:
  name: switch-config
data:
  foo: bar
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: switch
  labels:
    restarter.stackable.tech/enabled: "true"
spec:
  selector:
    matchLabels:
      app: switch
  serviceName: switch
  replicas: 2
  template:
    metadata:
      labels:
        app: switch
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: switch-config
