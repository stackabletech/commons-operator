---
# The first write after the switch restarts the Pods once, as it would have with resource-version,
# because the operator does not know the content the previous annotation value stood for. From then
# on, the annotation holds the content digest.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: kubectl label configmap switch-config --namespace $NAMESPACE third-party=first
