---
apiVersion: v2
name: commons-operator
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
description: "Kubernetes operator for common resources shared across the Stackable Data Platform (SDP)."
home: https://github.com/stackabletech/commons-operator
# One known use of this is the Artifact Hub (AH) listing which shows the logo.
# AH downloads the logo and re-hosts it.
# We opted to not use the project logos (e.g. the Apache Spark logo) here due to trademark concerns.
icon: https://raw.githubusercontent.com/stackabletech/commons-operator/main/.readme/static/borrowed/Icon_Stackable.svg
sources:
  - https://github.com/stackabletech/commons-operator
keywords: ["stackable", "data-platform", "kubernetes", "operator"]
maintainers:
  - name: Stackable
    url: https://www.stackable.tech
# Consumed by Artifact Hub, see https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  # The chart package ships no LICENSE file, so Artifact Hub cannot detect this itself.
  artifacthub.io/license: OSL-3.0
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/commons-operator/
    - name: support
      url: https://github.com/stackabletech/commons-operator/issues
  artifacthub.io/crds: |-
    - kind: AuthenticationClass
      version: v1alpha1
      name: authenticationclasses.authentication.stackable.tech
      displayName: AuthenticationClass
      description: The Stackable Platform uses the AuthenticationClass as a central mechanism to handle user authentication across supported products.
    - kind: S3Connection
      version: v1alpha1
      name: s3connections.s3.stackable.tech
      displayName: S3Connection
      description: A reusable definition of a connection to an S3 endpoint.
    - kind: S3Bucket
      version: v1alpha1
      name: s3buckets.s3.stackable.tech
      displayName: S3Bucket
      description: S3 bucket specification containing the bucket name and an inlined or referenced connection specification.
